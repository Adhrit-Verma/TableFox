[project]
name = "dbmap"
version = "0.1.0"
description = "Local PostgreSQL database graph mapper with FastAPI and MCP stdio entry points."
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "psycopg[binary,pool]>=3.2.0",
  "mcp>=2",
  "cryptography>=42",
  "PyJWT[crypto]>=2.8",
  "python-dotenv>=1.0.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.16"
]

[project.scripts]
dbmap-api = "dbmap.cli:run_api"
dbmap-mcp = "dbmap.mcp_server:main"
dbmap-snapshot = "dbmap.cli:print_snapshot"
dbmap-identity = "dbmap.cli:print_identity"
dbmap-create-key = "dbmap.cli:create_api_key"
dbmap-save-baseline = "dbmap.cli:save_baseline"
dbmap-review = "dbmap.cli:review_schema"
dbmap-context-scaffold = "dbmap.cli:scaffold_context"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dbmap"]
